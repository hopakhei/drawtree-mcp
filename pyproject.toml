[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drawtree-mcp"
version = "0.3.1"
description = "MCP server for Draw Tree — turn investment theses into structured falsifiable graphs"
authors = [{name = "pakhei ho"}]
license = {text = "MIT"}
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    # mcp 2.x (2026-10) removed the 1.x low-level Server decorators and changed FastMCP; both transports
    # here are written against 1.x. Pin until the port is done, or the next Render build breaks the hosted server.
    "mcp>=1.0.0,<2",
]

[project.optional-dependencies]
http = [
    "starlette>=0.37",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
drawtree-mcp = "drawtree_mcp.server:cli"
drawtree-mcp-http = "drawtree_mcp.http_server:main"

[tool.setuptools]
packages = ["drawtree_mcp", "drawtree_mcp._kernel"]

[tool.setuptools.package-data]
drawtree_mcp = ["../kb/frameworks.json"]
